[package]
name = "pa-recorder"
version = "0.1.0"
edition = "2021"
description = "Recording session state machine and capture orchestration for Process Analyzer"

[dependencies]
pa-import    = { path = "../import" }
thiserror    = "2"
tokio        = { version = "1", features = ["sync", "time", "process", "rt", "macros", "fs"] }
tokio-stream = "0.1"
futures      = { version = "0.3", default-features = false, features = ["std"] }
tracing      = "0.1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio    = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
bytes    = "1"
