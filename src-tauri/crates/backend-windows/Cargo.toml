[package]
name = "backend-windows"
version = "0.1.0"
edition = "2021"
description = "Windows ETW capture backend for process-analyzer"

[dependencies]
thiserror = "1"
tracing = "0.1"
bitflags = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
