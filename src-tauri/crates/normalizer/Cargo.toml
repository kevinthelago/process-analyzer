[package]
name = "normalizer"
version = "0.1.0"
edition = "2021"

[dependencies]
symbolicator = { path = "../symbolicator" }
thiserror = { workspace = true }
# Arrow columnar format — use the individual crates to avoid pulling in arrow-arith
# which has a chrono::quarter() name collision on recent Rust toolchains.
arrow-schema = "52"
arrow-array = "52"
# Fast integer hashing for stack interning
rustc-hash = "1"

[dev-dependencies]
tempfile = "3"
