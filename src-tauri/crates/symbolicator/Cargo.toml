[package]
name        = "symbolicator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
# DWARF / ELF / Mach-O symbol resolution
gimli     = "0.29"
addr2line = { version = "0.22", default-features = false, features = ["fallible-iterator", "object"] }
object    = { version = "0.36", default-features = false, features = ["read", "std"] }
# LRU cache for resolved symbols
lru       = "0.12"
# PDB symbol resolution (Windows)
pdb       = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
