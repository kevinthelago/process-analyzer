name: Release

# Triggers:
#   push to develop  →  nightly prerelease (rolling "nightly" tag)
#   push tag v*      →  stable release (idempotent: safe to re-run)
on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

# Cancel in-progress nightly builds when a newer develop commit arrives.
# Stable tag builds are never cancelled (each tag is unique).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  # ── 1. Test gate (HARD) ──────────────────────────────────────────────────
  # All three OS matrix legs must pass before any release artifact is built.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Show failures on all OSes, not just the first
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            webkit2gtk-driver

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps

      - name: cargo nextest
        run: cargo nextest run --workspace

      - name: vitest
        run: pnpm vitest run

      - name: Playwright — Linux (xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            xvfb-run --auto-servernum pnpm playwright test
          else
            echo "::notice::No playwright.config found — E2E skipped until app code lands"
          fi

      - name: Playwright — macOS / Windows
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            pnpm playwright test
          else
            echo "::notice::No playwright.config found — E2E skipped until app code lands"
          fi

  # ── 2. Create / update GitHub Release ────────────────────────────────────
  create-release:
    name: Create release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=Process Analyzer ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "body=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date -u +%Y-%m-%d)
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "tag_name=nightly" >> "$GITHUB_OUTPUT"
            echo "release_name=Process Analyzer Nightly" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "body=Automated nightly build from develop (${SHORT_SHA}) on ${DATE}" >> "$GITHUB_OUTPUT"
          fi

      # Delete the rolling nightly release so tauri-action can re-create it.
      # Stable releases are never deleted (idempotency handled by allowUpdates below).
      - name: Delete existing nightly release (nightly only)
        if: steps.meta.outputs.prerelease == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag || true

      - name: Create or update GitHub release
        id: create
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          body: ${{ steps.meta.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          # allowUpdates lets stable tag re-runs upload to the existing release
          # rather than failing with "release already exists".
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build & publish per OS ─────────────────────────────────────────────
  build-tauri:
    name: Build (${{ matrix.platform.name }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            os: ubuntu-latest
            rust-targets: ''
            tauri-args: ''
          - name: macos-universal
            os: macos-latest
            # Build a universal binary that runs natively on Apple Silicon and Intel.
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'
          - name: windows
            os: windows-latest
            rust-targets: ''
            tauri-args: ''

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-targets }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      # Warn (not fail) when code-signing secrets are absent. v1 ships unsigned;
      # this notice surfaces the gap without blocking the release.
      - name: Warn on missing signing secrets
        shell: bash
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$TAURI_KEY" ]; then
            echo "::warning title=Updater signing::TAURI_SIGNING_PRIVATE_KEY not set — updater artifacts will ship unsigned (v1 default; add secret to enable)"
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$APPLE_CERT" ]; then
            echo "::warning title=macOS code signing::APPLE_CERTIFICATE not set — macOS installer will not be notarized"
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -z "$WIN_CERT" ]; then
            echo "::warning title=Windows code signing::WINDOWS_CERTIFICATE_BASE64 not set — Windows installer will not be Authenticode-signed"
          fi

      - name: Build and upload with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — no-op when secret is absent (ships unsigned)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS notarization — no-op when secrets are absent
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode — no-op when secrets are absent
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # Upload to the release pre-created in the create-release job so
          # each OS leg attaches its artifacts to the same release object.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: ${{ needs.create-release.outputs.release_name }}
          prerelease: ${{ needs.create-release.outputs.prerelease == 'true' }}
          # Publish the Tauri updater manifest (latest.json) alongside installers.
          # Signed by TAURI_SIGNING_PRIVATE_KEY when present.
          includeUpdaterJson: true
          args: ${{ matrix.platform.tauri-args }}
